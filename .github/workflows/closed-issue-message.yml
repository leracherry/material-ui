name: Add closing message to issue

on:
  issues:
    types:
      - closed

permissions: {}

jobs:
  add-comment:
    name: Add closing message
    if: github.event.issue.state_reason == 'completed'
    uses: mui/mui-public/.github/workflows/issues_add-closing-message.yml@0a30ededb4ae97fb71cf7ca81d3ebab70333c38d # master
    permissions:
      contents: read
      issues: write
